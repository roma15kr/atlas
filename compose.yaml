name: atlas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:?REFRESH_TOKEN_SECRET is required}
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SEED_DEMO_DATA: "false"
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD is required}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-director}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Atlas Director}
      BOOTSTRAP_COMPANY_NAME: ${BOOTSTRAP_COMPANY_NAME:-Atlas}
      TRUST_PROXY: ${TRUST_PROXY:-2}
      STORAGE_DIR: /data/documents
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      VIBER_AUTH_TOKEN: ${VIBER_AUTH_TOKEN:-}
    volumes:
      - documents_data:/data/documents
    expose: ["3000"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose: ["80"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB:-atlas}
      PGUSER: ${POSTGRES_USER:-atlas}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres_backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        while true; do
          timestamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          partial="/backups/.atlas-$${timestamp}.partial"
          destination="/backups/atlas-$${timestamp}.dump"
          pg_dump --format=custom --file="$${partial}"
          pg_restore --list "$${partial}" >/dev/null
          mv "$${partial}" "$${destination}"
          date -u +%s > /backups/last-success
          find /backups -type f -name 'atlas-*.dump' -mtime "+$${BACKUP_RETENTION_DAYS:-14}" -delete
          sleep 86400
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && test $$(($$(date +%s) - $$(cat /backups/last-success))) -lt 90000"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 2m

  document-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - documents_data:/data/documents:ro
      - object_backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mkdir -p /backups/current
        while true; do
          cd /data/documents
          # Document files are immutable, so copying only missing keys is a complete incremental backup.
          find . -type f | while IFS= read -r file; do
            target="/backups/current/$${file#./}"
            if [ ! -e "$$target" ]; then
              mkdir -p "$$(dirname "$$target")"
              cp -p "$$file" "$$target.partial"
              mv "$$target.partial" "$$target"
            fi
          done
          date -u +%s > /backups/last-success
          sleep 86400
        done
    healthcheck:
      test: ["CMD-SHELL", "test -f /backups/last-success && test $$(($$(date +%s) - $$(cat /backups/last-success))) -lt 90000"]
      interval: 30m
      timeout: 10s
      retries: 3
      start_period: 2m

volumes:
  postgres_data:
  redis_data:
  documents_data:
  postgres_backups:
  object_backups:
