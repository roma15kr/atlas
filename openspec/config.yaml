schema: spec-driven

context: |
  Atlas: self-hosted virtual office for a ~20-person company team (path to 100+ users).
  Docker-first modular monolith; npm workspaces in apps/api and apps/web, Node.js 22.
  API: TypeScript, Express, zod, pg (PostgreSQL), redis, Socket.IO presence, file storage on a local volume (STORAGE_DIR; S3 optional when fully configured), pino, vitest + supertest.
  Web: React + TypeScript + Vite, served by Nginx on a single origin; vitest.
  UI is Russian-first, optimized for desktop Chrome.
  Roles: DIRECTOR (company-wide), MANAGER (own department), EMPLOYEE (own records);
  scope is enforced by SQL predicates in addition to route-level role checks.
  Sensitive actions (successful and denied) are written to the audit log.
  Single operating currency is UAH; API and DB reject other deal currencies.
  Integrations (Claude, Gmail, Outlook, Telegram, WhatsApp, Viber) are adapters that report
  "disabled" until server-side credentials exist; secrets never reach the web bundle.
  SQL migrations are checksummed and must never be edited after being applied; add new files.
  Conventional commits (feat:, fix(web):, docs:). See docs/ARCHITECTURE.md, docs/OPERATIONS.md.
  Agent rules, commands and testing traps are in AGENTS.md; decisions in docs/decisions/; lessons
  learned in docs/learnings.md; current state in STATUS.md; customer and business evidence in docs/product/.

rules:
  proposal:
    - "Start with Problem (in the end user's words), Evidence (links to docs/product/inbox reports, feedback or issues) and Success metric (one number tied to the business, and how it is measured)."
    - "Include an Announcement: 3-5 sentences telling users about the change. If you cannot write it convincingly, say the change may be the wrong one."
    - "Include a Non-goals section."
    - "No implementation details (tables, endpoints, file names) in the proposal; they belong in design."
    - "For UI changes, create plain HTML mockups (no framework) in mockups/ inside the change folder, one file per screen."
  specs:
    - "Requirements describe observable behavior with WHEN/THEN scenarios, never implementation details."
    - "Put each requirement in the spec of the feature it describes, including that feature's screens; web-workspace covers only the shared app shell."
  design:
    - "State the role/department access rules (DIRECTOR, MANAGER, EMPLOYEE) for any new data or endpoint."
    - "Call out new migrations and audit events explicitly."
    - "For web UI changes, follow the ui-design-system spec (tokens, type scale, padded cards, read-only lists, dialog editing, one primary action)."
    - "Read the relevant existing code before writing; never design against an imagined codebase."
    - "Include: Files (each file created or changed, and why), Types and signatures (no bodies), Call stack for each main flow, Test plan (test names and what each asserts)."
    - "End with Least confident decisions: a numbered list of the choices most worth challenging now."
    - "Record env var NAMES and external services in docs/external/ (never secret values)."
  tasks:
    - "Organize tasks as vertical slices. Slice 1 is a tracer bullet: thin, end to end and runnable. Then real logic one testable slice at a time. Never build horizontally (all database, then all API, then all UI)."
    - "Every slice ends in a working state, includes its tests, and is committed. A test must fail without the change it tests."
    - "Never skip, weaken or delete tests to get to green."
    - "Include verification with make check && npm run build (typecheck, lint, tests and build)."
    - "The last task is always to update STATUS.md."

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
