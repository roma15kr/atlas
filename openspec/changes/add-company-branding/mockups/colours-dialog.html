<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Змінити кольори · mockup</title>
<style>
  body { margin:0; font: 13px/1.45 Inter, system-ui, sans-serif; color:#202827; background:rgba(20,30,28,.45); min-height:100vh; display:grid; place-items:center; }
  .dialog { width:560px; background:#fff; border-radius:7px; box-shadow:0 20px 60px rgba(0,0,0,.25); }
  header, footer { padding:16px 20px; } header { border-bottom:1px solid #dfe5e3; } header h2 { margin:0; font-size:16px; } header p { margin:3px 0 0; color:#687472; }
  .body { padding:18px 20px; } h3 { font-size:12px; color:#687472; margin:0 0 8px; font-weight:600; }
  .presets { display:grid; grid-template-columns:repeat(8, 1fr); gap:8px; margin-bottom:18px; }
  .presets button { height:40px; border:2px solid transparent; border-radius:5px; padding:0; overflow:hidden; display:flex; cursor:pointer; }
  .presets button.on { border-color:#202827; } .presets i { flex:1; }
  .fields { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:14px; } label span { display:block; font-weight:600; margin-bottom:4px; }
  .pick { display:flex; gap:6px; } .pick input[type=color] { width:38px; height:34px; border:1px solid #cbd5d2; border-radius:5px; padding:2px; } .pick input[type=text] { flex:1; border:1px solid #cbd5d2; border-radius:5px; padding:7px 9px; font:inherit; }
  .bad input[type=text] { border-color:#a44444; } .hint { font-size:11px; color:#a44444; margin-top:4px; }
  .preview { display:flex; border:1px solid #dfe5e3; border-radius:7px; overflow:hidden; } .side { width:140px; background:#1f2540; color:#fff; padding:12px; } .side span { display:block; padding:6px 8px; border-radius:5px; color:#a9aecb; } .side .on { background:rgba(255,255,255,.1); color:#fff; }
  .main { flex:1; padding:14px; } .btn { border:1px solid #dfe5e3; background:#fff; border-radius:5px; padding:7px 12px; font:inherit; }
  .accent { background:#f5d90a; border-color:#f5d90a; color:#fff; }
  footer { border-top:1px solid #dfe5e3; display:flex; justify-content:flex-end; gap:8px; } footer .save { background:#176f68; color:#fff; border-color:#176f68; opacity:.45; }
</style>
</head>
<body>
<div class="dialog" role="dialog" aria-label="Змінити кольори">
  <header><h2>Змінити кольори</h2><p>Акцент — кнопки, посилання й активні елементи. Кольори статусів не змінюються.</p></header>
  <div class="body">
    <h3>Готові поєднання</h3>
    <div class="presets">
      <button class="" title="Atlas"><i style="background:#176f68"></i><i style="background:#1d2a28"></i></button>
      <button title="Індиго"><i style="background:#3949ab"></i><i style="background:#1f2540"></i></button>
      <button title="Океан"><i style="background:#0b6aa8"></i><i style="background:#14283a"></i></button>
      <button title="Ліс"><i style="background:#2e7d32"></i><i style="background:#1b2a1c"></i></button>
      <button title="Бордо"><i style="background:#9c2f4a"></i><i style="background:#2a1a20"></i></button>
      <button title="Бурштин"><i style="background:#a55a12"></i><i style="background:#2b2118"></i></button>
      <button title="Графіт"><i style="background:#37474f"></i><i style="background:#f1f3f2"></i></button>
      <button title="Слива"><i style="background:#6a3d9a"></i><i style="background:#221a2e"></i></button>
    </div>
    <div class="fields">
      <label class="bad"><span>Акцентний колір</span><span class="pick"><input type="color" value="#f5d90a"><input type="text" value="#f5d90a"></span>
        <div class="hint">Білий текст на цьому кольорі важко читати (контраст 1,4 : 1, потрібно щонайменше 4,5 : 1). Оберіть темніший відтінок.</div></label>
      <label><span>Колір бічної панелі</span><span class="pick"><input type="color" value="#1f2540"><input type="text" value="#1f2540"></span></label>
    </div>
    <h3>Попередній перегляд</h3>
    <div class="preview"><div class="side"><b>RDIM Office</b><span>CRM</span><span class="on">Задачі</span></div><div class="main"><button class="btn accent">Нова задача</button></div></div>
  </div>
  <footer><button class="btn">Скасувати</button><button class="btn save" disabled>Зберегти</button></footer>
</div>
</body>
</html>
