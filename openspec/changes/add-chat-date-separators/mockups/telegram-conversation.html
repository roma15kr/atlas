<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Telegram: разделители дней</title>
<style>
  body { margin: 0; font: 13px/1.45 system-ui, sans-serif; background: #f4f6f5; color: #17211d; }
  .chat { width: 620px; margin: 24px auto; border: 1px solid #e3e8e6; border-radius: 12px; overflow: hidden; background: #fff; }
  header { padding: 12px 16px; border-bottom: 1px solid #edf0ef; } header small { color: #6b7772; display: block; }
  .feed { height: 380px; overflow-y: auto; padding: 0 14px 14px; background: #f7f9f8; display: flex; flex-direction: column; gap: 8px; }
  .day { position: sticky; top: 0; z-index: 1; display: flex; justify-content: center; padding: 8px 0 0; }
  .day span { padding: 2px 10px; border-radius: 999px; background: #fff; border: 1px solid #e3e8e6; color: #5d6964; font-size: 11px; font-weight: 650; }
  .b { max-width: 70%; padding: 7px 10px; border-radius: 10px; background: #fff; border: 1px solid #e3e8e6; }
  .out { align-self: flex-end; background: #e9f5f0; border-color: #cfe8dd; }
  .b footer { color: #8a9590; font-size: 10px; text-align: right; } .b small { color: #1f7a5a; font-weight: 650; display: block; }
</style></head><body>
<div class="chat">
  <header><b>ТОВ «Тепло-Дім»</b><small>@teplodim · Ответственный: Бабенко</small></header>
  <div class="feed">
    <div class="day" role="separator"><span>28 декабря 2025</span></div>
    <div class="b">Добрый день, есть терморегуляторы в наличии?<footer>16:02</footer></div>
    <div class="b out"><small>Бабенко</small>Да, 40 шт. на складе.<footer>16:10</footer></div>
    <div class="day" role="separator"><span>Вчера</span></div>
    <div class="b">Пришлите счёт, пожалуйста<footer>11:20</footer></div>
    <div class="day" role="separator"><span>Сегодня</span></div>
    <div class="b out"><small>Бабенко</small>Счёт отправил на почту.<footer>09:05</footer></div>
  </div>
</div>
</body></html>
